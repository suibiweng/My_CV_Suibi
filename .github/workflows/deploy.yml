name: Build LaTeX CV and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "CV.tex"
      - "Sections/**"
      - "index.html"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile CV.tex to CV.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: CV.tex
          latexmk_use_xelatex: false

      - name: Commit updated CV.pdf back to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Update compiled CV.pdf"
            git push
          fi

      - name: Prepare website folder
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp CV.pdf _site/CV.pdf
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
